; Настройки git для загрузки зависимостей на нестабильной сети.
;
; Файл используется через переменную GIT_CONFIG_GLOBAL, которую
; выставляет build\prepare-desktop-retry.ps1. Отдельный файл нужен
; потому, что системный и пользовательский конфиги лежат на диске C,
; который трогать нельзя, а глобальная настройка postBuffer
; действует на все репозитории машины.
;
; Причина появления: сборка Telegram Desktop загружает около
; 30 репозиториев, крупнейший — openssl (~200 МБ). На этой сети
; соединение рвётся на середине, и git сообщает:
;   error: RPC failed; curl 56 Recv failure: Connection was reset
;   error: N bytes of body are still expected
;   fatal: early EOF
; Из-за этого стадия openssl3 падала 25 попыток подряд, хотя
; сам openssl ни при чём не был виноват.
;
; Что здесь настроено и почему:
;   postBuffer      — не отправлять тело запроса блоками;
;   HTTP/1.1        — h2-мультиплексинг на этой сети теряет
;                     пакеты, переключение на HTTP/1.1 убирает
;                     часть разрывов;
;   lowSpeedLimit 0 — не прерывать загрузку из-за медленного
;                     канала (по умолчанию git рвёт соединение при
;                     низкой скорости);
;   maxRequests 1   — один запрос на соединение вместо
;                     мультиплексированных, меньше chances
;                     оборваться целиком.

[http]
	postBuffer = 524288000
	version = HTTP/1.1
	lowSpeedLimit = 0
	lowSpeedTime = 999999
	maxRequests = 1